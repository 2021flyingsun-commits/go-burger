        const TOKYO_SHOPS = generateTokyoShops();

        const OTHER_SHOPS = [];

        // Merge curated shops with FULL_TOKYO_SHOPS, filtering out chains and low-quality entries
        const CHAIN_NAMES = ['freshness burger', 'mcdonalds', 'mcdonald\'s', 'mos burger', 'carl\'s jr', 'cocos', 'family mart', 'famima',
            'lotteria', 'first kitchen', 'burger king', 'wendy\'s', 'nakau', 'matsuya', 'zetteria'];

            const nameLower = s.name.toLowerCase();
            // Skip chains
            if (CHAIN_NAMES.some(chain => nameLower.includes(chain))) return false;
            // Skip entries with very poor coordinates (islands far from Tokyo)
            if (s.lat < 35.5 || s.lat > 35.85 || s.lng < 139.3 || s.lng > 139.95) return false;
            // Skip N/A entries with no useful data at all
            if (s.hours === 'N/A' && s.website === 'N/A') return false;
            return true;

        // Merge: curated first, then extra (deduplicate by name)

        const curatedNames = new Set(CURATED_SHOPS.map(s => s.name.toLowerCase()));

        // --- UTILITIES ---
        function haversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // metres
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c;
        }

        function isShopOpenNow(hoursStr) {
            if (!hoursStr || hoursStr === 'N/A' || hoursStr === '24時間') return hoursStr === '24時間';
            const now = new Date();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            const parseTime = (t) => {
                const m = t.trim().match(/(\d{1,2}):(\d{2})/);
                return m ? parseInt(m[1]) * 60 + parseInt(m[2]) : null;
            };
            const ranges = hoursStr.split('/');
            for (const range of ranges) {
                const parts = range.match(/(\d{1,2}:\d{2})[-〜](\d{1,2}:\d{2})/);
                if (!parts) continue;
                const open = parseTime(parts[1]);
                const close = parseTime(parts[2]);
                if (open === null || close === null) continue;
                if (close < open) { // midnight wrap
                    if (currentMinutes >= open || currentMinutes <= close) return true;
                } else {
                    if (currentMinutes >= open && currentMinutes <= close) return true;
                }
            }
            return false;
        }

        function isCashless(paymentStr) {
            if (!paymentStr || paymentStr === 'N/A') return false;
            return !/^現金のみ$/i.test(paymentStr.trim()) && paymentStr.toLowerCase() !== '現金';
        }

        // --- COMPONENTS ---

        function MapView({ selectedPrefecture, onBack, visitedShops, toggleVisited }) {
            const mapRef = useRef(null);

            // Feature 6: Walking Distance

            const [walkingTime, setWalkingTime] = useState(null);

            // Feature 7: Dice Roll
            const [isRolling, setIsRolling] = useState(false);

            // Feature 2: Favorites
            const [favoriteShops, setFavoriteShops] = useState(() => {
                const saved = localStorage.getItem('burger_favorites');
                return saved ? new Set(JSON.parse(saved)) : new Set();
            });
            const toggleFavorite = (id) => {
                setFavoriteShops(prev => {
                    const next = new Set(prev);
                    if (next.has(id)) next.delete(id); else next.add(id);
                    localStorage.setItem('burger_favorites', JSON.stringify([...next]));
                    return next;
                });
            };

            // Feature 5: Reviews
            const [shopReviews, setShopReviews] = useState(() => {
                const saved = localStorage.getItem('burger_reviews');
                return saved ? JSON.parse(saved) : {};
            });
            const saveReview = (id, rating, memo) => {
                setShopReviews(prev => {
                    const next = { ...prev, [id]: { rating, memo } };
                    localStorage.setItem('burger_reviews', JSON.stringify(next));
                    return next;
                });
            };

            // Feature 3: Filters
            const [showOpenNow, setShowOpenNow] = useState(false);
            const [showCashlessOnly, setShowCashlessOnly] = useState(false);
            const [visitFilter, setVisitFilter] = useState('all'); // 'all' | 'visited' | 'favorites'

            // Toggle Admin Mode (Click search input 5 times or some hidden element)
            const handleAdminToggle = () => {
                setAdminClickCount(prev => {

                    if (next >= 5) {

                        alert(isAdmin ? "管理者モードをオフにしました。" : "管理者モードをオンにしました！");
                        return 0;
                    }
                    return next;
                });
            };

            // Initialize Map
            useEffect(() => {
                if (!mapRef.current) return;

                if (localMap) {

                    markersRef.current.clear();
                }

                const map = L.map(mapRef.current, { zoomControl: false }).setView([selectedPrefecture.lat, selectedPrefecture.lng], 12);

                L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                    subdomains: 'abcd',

                L.control.zoom({ position: 'topright' }).addTo(map);

                setLocalMap(map);

                return () => {
                    map.remove();

            // Initialize AdSense
            useEffect(() => {

                    (window.adsbygoogle = window.adsbygoogle || []).push({});
                } catch (e) {
                    console.error("AdSense error:", e);
                }
            }, []);

            // Filter & Update Markers
            useEffect(() => {
                if (!localMap) return;

                const markerLayer = L.layerGroup();
                markersRef.current.clear();

                // 1. All Shops (curated + extra from FULL_TOKYO_SHOPS)
                const curatedMatches = ALL_SHOPS.filter(shop => {
                    const q = searchQuery.toLowerCase();
                    const matchesSearch = !q ||
                        shop.name.toLowerCase().includes(q) ||
                        shop.address.toLowerCase().includes(q) ||
                        (shop.payment || '').toLowerCase().includes(q) ||
                        (shop.hours || '').toLowerCase().includes(q);
                    const isVisited = visitedShops.has(shop.id);
                    const isFav = favoriteShops.has(shop.id);
                    if (showOnlyUnvisited && isVisited) return false;
                    if (visitFilter === 'visited' && !isVisited) return false;
                    if (visitFilter === 'favorites' && !isFav) return false;
                    if (showOpenNow && !isShopOpenNow(shop.hours)) return false;
                    if (showCashlessOnly && !isCashless(shop.payment)) return false;

                    if (walkingOrigin && walkingTime) {
                        const dist = haversineDistance(walkingOrigin.lat, walkingOrigin.lng, shop.lat, shop.lng);
                        if (dist > walkingTime * 80) return false;
                    }

                    return matchesSearch;
                });

                curatedMatches.forEach(shop => {
                    // Local mutable state to avoid stale closure issues with React state
                    let localVisited = visitedShops.has(shop.id);
                    let localFav = favoriteShops.has(shop.id);
                    const getIcon = () => localVisited ? yellowIcon : localFav ? blueIcon : redIcon;
                    const marker = L.marker([shop.lat, shop.lng], {
                        icon: getIcon(),

                                ${shop.website ? `<a href="${shop.website}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center gap-2 w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 !text-white font-bold py-2.5 rounded-lg text-sm mt-1 mb-1 transition-all shadow-md hover:shadow-lg hover:scale-[1.02] active:scale-95" style="color: white !important;"><span>🌐</span> ウェブサイトを開く <span style="font-size:10px;opacity:0.8">↗</span></a>` : ''}
                            </div>
                            <a href="https://www.google.com/maps/dir/?api=1&destination=${shop.lat},${shop.lng}" target="_blank" rel="noopener noreferrer"

                        document.getElementById(`save-edit-${shop.id}`).onclick = () => {

                        if (checkbox) {

                            name: "新規ショップ",
                            address: "住所を入力",
                            lat: e.latlng.lat,
                            lng: e.latlng.lng,
                            hours: "24時間",
                            payment: "現金のみ",
                            website: null
                        };
                        ALL_SHOPS.push(newShop);
                        // Refresh marks (simplified)
                        setSearchQuery(q => q + " ");
                        setSearchQuery(q => q.trim());
                    });
                }

                if (walkingCircleRef.current) {
                    localMap.removeLayer(walkingCircleRef.current);
                    walkingCircleRef.current = null;
                }

                if (walkingOrigin && walkingTime) {
                    const maxDist = walkingTime * 80;
                    
                    const circle = L.circle([walkingOrigin.lat, walkingOrigin.lng], {
                        color: '#ef4444',
                        fillColor: '#ef4444',
                        fillOpacity: 0.1,
                        radius: maxDist,
                        weight: 2,
                        dashArray: '5, 5'
                    });
                    
                    const originIcon = L.divIcon({
                        className: 'custom-origin-icon',
                        html: `<div class="relative w-8 h-8">
                                 <div class="absolute inset-0 bg-blue-500 rounded-full opacity-75 animate-ping"></div>
                                 <div class="absolute inset-0 bg-blue-600 rounded-full border-2 border-white shadow-lg flex items-center justify-center text-white text-[10px] font-bold">📍</div>
                               </div>`,
                        iconSize: [32, 32],
                        iconAnchor: [16, 16]
                    });
                    
                    const originMarker = L.marker([walkingOrigin.lat, walkingOrigin.lng], { icon: originIcon }).bindPopup(`<b>${walkingOrigin.name}</b><br>ここから徒歩${walkingTime}分圏内`);
                    
                    walkingCircleRef.current = L.featureGroup([circle, originMarker]).addTo(localMap);
                }

                localMap.addLayer(markerLayer);

                return () => {
                    localMap.removeLayer(markerLayer);
                    if (walkingCircleRef.current) {
                        localMap.removeLayer(walkingCircleRef.current);
                        walkingCircleRef.current = null;
                    }
                };

            }, [localMap, visitedShops, favoriteShops, shopReviews, searchQuery, isAdmin, showOnlyUnvisited, visitFilter, showOpenNow, showCashlessOnly, walkingOrigin, walkingTime]);

            const handleSaveData = async () => {
                setIsSaving(true);
                try {
                    const response = await fetch('/save-data', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(ALL_SHOPS)
                    });
                    if (response.ok) {
                        alert("変更を保存しました！");
                    } else {
                        alert("保存に失敗しました。サーバーが起動しているか確認してください。");
                    }
                } catch (e) {
                    alert("通信エラーが発生しました。");
                } finally {
                    setIsSaving(false);
                }
            };

            const handleSearchSubmit = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const match = ALL_SHOPS.find(shop =>
                        shop.name.toLowerCase().includes(searchQuery.toLowerCase())
                    );

                    if (match && localMap) {
                        localMap.flyTo([match.lat, match.lng], 16, { duration: 1.5 });
                        setTimeout(() => {
                            const marker = markersRef.current.get(match.id);
                            if (marker) marker.openPopup();
                        }, 1500);
                    }
                }
            };

            const handleCurrentLocation = () => {
                if (!localMap) return;

                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition((position) => {
                        const { latitude, longitude } = position.coords;
                        localMap.flyTo([latitude, longitude], 15);

                        if (currentLocationLayer) {
                            localMap.removeLayer(currentLocationLayer);
                        }

                        const pulsingIcon = L.divIcon({
                            className: 'custom-location-icon',
                            html: `<div class="relative w-8 h-8">
                                     <div class="absolute inset-0 bg-brand-500 rounded-full animate-ping opacity-75"></div>
                                     <div class="absolute inset-0 bg-brand-600 rounded-full border-4 border-white shadow-lg"></div>
                                   </div>`,
                            iconSize: [32, 32],
                            iconAnchor: [16, 16]
                        });

                        const marker = L.marker([latitude, longitude], { icon: pulsingIcon }).addTo(localMap);
                        setCurrentLocationLayer(marker);

                    }, (error) => {
                        alert("位置情報を取得できませんでした: " + error.message);
                    });
                } else {
                    alert("お使いのブラウザは位置情報に対応していません。");
                }
            };

            const handleLocationSearch = async () => {
                if (!locationQuery.trim()) return;
                setIsLocating(true);
                try {
                    // viewbox for Kanto region bounded=1
                    const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(locationQuery + ' 駅')}&viewbox=138.9,36.3,140.9,35.0&bounded=1&limit=1`);
                    const data = await response.json();
                    if (data && data.length > 0) {
                        const loc = data[0];
                        setWalkingOrigin({
                            lat: parseFloat(loc.lat),
                            lng: parseFloat(loc.lon),
                            name: locationQuery
                        });
                        if (!walkingTime) setWalkingTime(10);
                        if (localMap) {
                            localMap.flyTo([loc.lat, loc.lon], 15);
                        }
                    } else {
                        alert("指定された駅・地名が見つかりませんでした。");
                    }
                } catch (e) {
                    alert("検索中にエラーが発生しました。");
                } finally {
                    setIsLocating(false);
                }
            };

            const handleOriginCurrentLocation = () => {
                if ("geolocation" in navigator) {
                    setIsLocating(true);
                    navigator.geolocation.getCurrentPosition((position) => {
                        const { latitude, longitude } = position.coords;
                        setWalkingOrigin({
                            lat: latitude,
                            lng: longitude,
                            name: "現在地"
                        });
                        if (!walkingTime) setWalkingTime(10);
                        if (localMap) {
                            localMap.flyTo([latitude, longitude], 15);
                        }
                        setIsLocating(false);
                    }, (error) => {
                        alert("位置情報を取得できませんでした: " + error.message);
                        setIsLocating(false);
                    });
                } else {
                    alert("お使いのブラウザは位置情報に対応していません。");
                }
            };

            const handleDiceRoll = () => {
                if (!localMap || ALL_SHOPS.length === 0 || isRolling) return;
                setIsRolling(true);
                
                let rolls = 0;
                const maxRolls = 15;
                const interval = setInterval(() => {
                    rolls++;
                    const randomShop = ALL_SHOPS[Math.floor(Math.random() * ALL_SHOPS.length)];
                    setRollingShopName(randomShop.name);
                    
                    if (rolls >= maxRolls) {
                        clearInterval(interval);
                        const finalShop = ALL_SHOPS[Math.floor(Math.random() * ALL_SHOPS.length)];
                        setRollingShopName(finalShop.name);
                        
                        setTimeout(() => {
                            setIsRolling(false);
                            setRollingShopName(null);
                            
                            localMap.flyTo([finalShop.lat, finalShop.lng], 16, { duration: 1.5 });
                            
                            setTimeout(() => {
                                const marker = markersRef.current.get(finalShop.id);
                                if (marker) {
                                    marker.openPopup();
                                }
                            }, 1500);
                        }, 800);
                    }
                }, 100);
            };

            return (
                <div className="relative h-screen w-full bg-stone-100 font-sans overflow-hidden">
                    <div id="map" ref={mapRef} className="h-full w-full"></div>

                    {isRolling && (
                        <div className="absolute inset-0 z-[2000] bg-black/40 backdrop-blur-sm flex flex-col items-center justify-center pointer-events-none transition-opacity duration-300">
                            <div className="bg-white p-8 rounded-3xl shadow-2xl text-center min-w-[320px] max-w-[90%] animate-bounce">
                                <span className="text-6xl mb-4 block animate-spin origin-center">🎲</span>
                                <p className="text-sm font-bold text-gray-500 mb-2">どこに行こうかな...</p>
                                <h2 className="text-xl md:text-2xl font-black text-brand-700 bg-brand-50 px-4 py-2 rounded-xl border border-brand-100">{rollingShopName}</h2>
                            </div>
                        </div>
                    )}

                    <div className="absolute top-0 left-0 right-0 p-3 md:p-4 pointer-events-none z-[1000] flex flex-col gap-2">
                        <div className="flex w-full gap-2 pointer-events-auto shadow-xl rounded-xl bg-white p-1 items-center">
                            <div 
                                onClick={handleAdminToggle}
                                className="px-3 py-2 bg-brand-600 text-white font-black rounded-lg cursor-pointer select-none hover:bg-brand-500 transition-colors flex-shrink-0"
                            >
                                GO BURGER
                            </div>
                            <input
                                type="text"
                                placeholder="店名を検索..."
                                className="flex-1 px-4 py-2 rounded-lg border-2 border-transparent focus:border-brand-500 outline-none font-bold text-stone-700 bg-slate-50 focus:bg-white transition-colors min-w-0"
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                onKeyDown={handleSearchSubmit}
                            />
                            <button
                                onClick={() => setMenuOpen(!menuOpen)}
                                className={`md:hidden px-3 py-2 rounded-lg font-bold text-sm transition-all flex-shrink-0 ${menuOpen ? 'bg-brand-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                            >
                                {menuOpen ? '✕' : '☰'}
                            </button>
                            <div className="hidden md:flex gap-2 items-center">
                                <button
                                    onClick={() => setShowWalkingFilter(!showWalkingFilter)}
                                    className={`px-3 py-2 rounded-lg font-bold text-xs transition-all flex items-center gap-1 ${showWalkingFilter || walkingOrigin ? 'bg-red-500 text-white' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}
                                    title="徒歩圏内で探す"
                                >
                                    📍 徒歩圏内
                                </button>
                                <button
                                    onClick={() => setVisitFilter(f => f === 'all' ? 'visited' : f === 'visited' ? 'favorites' : 'all')}
                                    className={`px-3 py-2 rounded-lg font-bold text-xs transition-all flex items-center gap-1 ${
                                        visitFilter === 'visited' ? 'bg-yellow-500 text-white' :
                                        visitFilter === 'favorites' ? 'bg-blue-500 text-white' :
                                        'bg-slate-100 text-slate-500 hover:bg-slate-200'
                                    }`}
                                    title="表示フィルター切替"
                                >
                                    {visitFilter === 'visited' ? '🟡 行った' : visitFilter === 'favorites' ? '🔵 行きたい' : '🍔 全店舗'}
                                </button>
                                <button
                                    onClick={() => setShowOpenNow(!showOpenNow)}
                                    className={`px-3 py-2 rounded-lg font-bold text-xs transition-all ${showOpenNow ? 'bg-green-500 text-white' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}
                                    title="現在営業中のみ"
                                >
                                    🕒 営業中
                                </button>
                                <button
                                    onClick={() => setShowCashlessOnly(!showCashlessOnly)}
                                    className={`px-3 py-2 rounded-lg font-bold text-xs transition-all ${showCashlessOnly ? 'bg-purple-500 text-white' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}
                                    title="キャッシュレス対応のみ"
                                >
                                    💳 キャッシュレス
                                </button>
                            </div>
                        </div>

                        {menuOpen && (
                            <div className="md:hidden pointer-events-auto flex gap-2 flex-wrap bg-white/95 backdrop-blur-sm shadow-xl rounded-xl p-2 animate-[fadeIn_0.15s_ease-out]">
                                <button
                                    onClick={() => { setShowWalkingFilter(!showWalkingFilter); setMenuOpen(false); }}
                                    className={`px-3 py-2 rounded-lg font-bold text-xs transition-all flex items-center gap-1 ${showWalkingFilter || walkingOrigin ? 'bg-red-500 text-white' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}
                                >
                                    📍 徒歩圏内
                                </button>
                                <button
                                    onClick={() => { setVisitFilter(f => f === 'all' ? 'visited' : f === 'visited' ? 'favorites' : 'all'); setMenuOpen(false); }}
                                    className={`px-3 py-2 rounded-lg font-bold text-xs transition-all flex items-center gap-1 ${
                                        visitFilter === 'visited' ? 'bg-yellow-500 text-white' :
                                        visitFilter === 'favorites' ? 'bg-blue-500 text-white' :
                                        'bg-slate-100 text-slate-500 hover:bg-slate-200'
                                    }`}
                                >
                                    {visitFilter === 'visited' ? '🟡 行った' : visitFilter === 'favorites' ? '🔵 行きたい' : '🍔 全店舗'}
                                </button>
                                <button
                                    onClick={() => { setShowOpenNow(!showOpenNow); setMenuOpen(false); }}
                                    className={`px-3 py-2 rounded-lg font-bold text-xs transition-all ${showOpenNow ? 'bg-green-500 text-white' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}
                                >
                                    🕒 営業中
                                </button>
                                <button
                                    onClick={() => { setShowCashlessOnly(!showCashlessOnly); setMenuOpen(false); }}
                                    className={`px-3 py-2 rounded-lg font-bold text-xs transition-all ${showCashlessOnly ? 'bg-purple-500 text-white' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}
                                >
                                    💳 キャッシュレス
                                </button>
                            </div>
                        )}

                        {showWalkingFilter && (
                            <div className="pointer-events-auto absolute top-16 left-4 md:left-64 bg-white p-4 rounded-xl shadow-2xl border border-gray-100 z-[1001] w-80">
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="font-bold text-gray-800">📍 徒歩圏内で探す</h3>
                                    <button onClick={() => setShowWalkingFilter(false)} className="text-gray-400 hover:text-gray-600 font-bold">✕</button>
                                </div>
                                
                                <div className="flex gap-2 mb-3">
                                    <input 
                                        type="text" 
                                        placeholder="駅名・地名（例: 新宿）" 
                                        className="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50 focus:bg-white focus:border-brand-500 outline-none"
                                        value={locationQuery}
                                        onChange={(e) => setLocationQuery(e.target.value)}
                                        onKeyDown={(e) => e.key === 'Enter' && handleLocationSearch()}
                                    />
                                    <button 
                                        onClick={handleLocationSearch}
                                        disabled={isLocating}
                                        className="bg-brand-600 hover:bg-brand-500 text-white px-3 py-2 rounded-lg font-bold text-sm whitespace-nowrap disabled:opacity-50"
                                    >
                                        検索
                                    </button>
                                </div>
                                
                                <button 
                                    onClick={handleOriginCurrentLocation}
                                    disabled={isLocating}
                                    className="w-full mb-4 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 py-2 rounded-lg font-bold text-sm flex items-center justify-center gap-2 transition-colors disabled:opacity-50"
                                >
                                    {isLocating ? '⏳ 取得中...' : '🎯 現在地から探す'}
                                </button>
                                
                                {walkingOrigin && (
                                    <div className="bg-slate-50 p-3 rounded-lg border border-slate-100">
                                        <p className="text-xs text-gray-500 mb-2 font-bold flex justify-between">
                                            <span>基準点: <span className="text-brand-600">{walkingOrigin.name}</span></span>
                                            <button onClick={() => { setWalkingOrigin(null); setWalkingTime(null); }} className="text-red-500 hover:underline">クリア</button>
                                        </p>
                                        <div className="grid grid-cols-4 gap-1">
                                            {[5, 10, 15, null].map(mins => (
                                                <button
                                                    key={mins || 'none'}
                                                    onClick={() => setWalkingTime(mins)}
                                                    className={`py-1.5 rounded text-xs font-bold transition-colors ${walkingTime === mins ? 'bg-brand-500 text-white shadow-sm' : 'bg-white border border-gray-200 text-gray-600 hover:bg-gray-50'}`}
                                                >
                                                    {mins ? `${mins}分` : '解除'}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {isAdmin && (
                            <div className="pointer-events-auto flex flex-col items-end">
                                <button
                                    onClick={handleSaveData}
                                    disabled={isSaving}
                                    className={`${isSaving ? 'bg-green-800 scale-95 opacity-80' : 'bg-green-600 hover:bg-green-500'} text-white px-6 py-3 rounded-xl shadow-xl font-black transition-all active:scale-95 flex items-center gap-2`}
                                >
                                    {isSaving ? "⌛ 保存中..." : "💾 変更を保存"}
                                </button>
                                <div className="text-[10px] text-brand-900 font-bold bg-white/80 px-2 py-1 rounded mt-1 backdrop-blur-sm shadow-sm">
                                    【管理者モード】地図右クリックで追加 / マカドラッグで移動
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="absolute bottom-[150px] right-6 md:bottom-[130px] md:right-10 z-[1000] pointer-events-auto flex flex-col gap-3">
                        <button
                            onClick={handleDiceRoll}
                            disabled={isRolling}
                            className={`bg-indigo-600 text-white w-14 h-14 md:w-16 md:h-16 rounded-full shadow-2xl hover:bg-indigo-500 hover:scale-110 active:scale-95 transition-all duration-300 flex items-center justify-center border-4 border-white ${isRolling ? 'animate-spin' : ''}`}
                            title="今日行くお店をサイコロで決める！"
                        >
                            <span className="text-3xl md:text-4xl">🎲</span>
                        </button>
                        <button
                            onClick={handleCurrentLocation}
                            className="bg-sky-500 text-white w-14 h-14 md:w-16 md:h-16 rounded-full shadow-2xl hover:bg-sky-400 hover:scale-110 active:scale-95 transition-all duration-300 flex items-center justify-center border-4 border-white"
                            title="現在地を表示"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" className="-ml-1 mt-1">
                                <polygon points="3 11 22 2 13 21 11 13 3 11" />
                            </svg>
                        </button>
                    </div>

                    <div className="absolute bottom-0 left-0 right-0 z-[1000] pointer-events-auto bg-gray-100/95 backdrop-blur-sm border-t border-gray-300 flex flex-col items-center justify-start shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] h-[75px] md:h-[115px] overflow-hidden">
                        <div className="text-[10px] text-gray-500 font-bold tracking-widest leading-none py-1">スポンサーリンク</div>
                        <div className="w-[320px] md:w-[728px] h-[50px] md:h-[90px] bg-white flex items-center justify-center overflow-hidden shadow-inner">
                            <ins className="adsbygoogle"
                                 style={{ display: 'inline-block', width: '100%', height: '100%' }}
                                 data-ad-client="ca-pub-9509204113741918"
                                 data-ad-slot="4612673168"
                                 data-ad-format="horizontal"
                                 data-full-width-responsive="false"></ins>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [selectedPrefecture] = useState(PREFECTURES.find(p => p.name === "東京都"));

            const [visitedShops, setVisitedShops] = useState(() => {
                const saved = localStorage.getItem('burger_visited');
                return saved ? new Set(JSON.parse(saved)) : new Set();
            });

            const toggleVisited = (id) => {
                setVisitedShops(prev => {
                    const newSet = new Set(prev);
                    if (newSet.has(id)) {
                        newSet.delete(id);
                    } else {
                        newSet.add(id);
                    }
                    localStorage.setItem('burger_visited', JSON.stringify([...newSet]));
                    return newSet;
                });
            };

            return (
                <div className="h-full w-full">
                    <MapView
                        selectedPrefecture={selectedPrefecture}
                        onBack={() => { }}
                        visitedShops={visitedShops}
                        toggleVisited={toggleVisited}
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        lucide.createIcons();
    </script>
</body>

</html>
